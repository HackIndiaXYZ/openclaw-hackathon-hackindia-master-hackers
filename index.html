<!DOCTYPE html>
<html>
<head>
  <title>AI Study Planner</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>📚 AI Study Planner</h1>
  <p>✨ Plan smarter. Study better. Achieve more.</p>

  <p>Enter study hours:</p>
  <input type="number" id="hours" placeholder="e.g. 5">

  <br>
  <button onclick="generatePlan()">Generate Plan</button>

  <h2 id="output"></h2>
  <h3>✅ Track Your Progress</h3>

<label><input type="checkbox" onchange="saveProgress()"> Math Done</label><br>
<label><input type="checkbox" onchange="saveProgress()"> Physics Done</label><br>
<label><input type="checkbox" onchange="saveProgress()"> Chemistry Done</label><br>

  <script>
    function saveProgress() {
  let checks = document.querySelectorAll("input[type=checkbox]");
  let progress = [];

  checks.forEach((c, i) => {
    progress[i] = c.checked;
  });

  localStorage.setItem("progress", JSON.stringify(progress));
}

window.onload = function() {
  let saved = JSON.parse(localStorage.getItem("progress"));
  if (saved) {
    let checks = document.querySelectorAll("input[type=checkbox]");
    checks.forEach((c, i) => {
      c.checked = saved[i];
    });
  }
}
  function generatePlan() {
    let hours = document.getElementById("hours").value;

    if (hours == "") {
      alert("Enter hours!");
      return;
    }

    let math = (hours * 0.4).toFixed(1);
    let physics = (hours * 0.3).toFixed(1);
    let chemistry = (hours * 0.3).toFixed(1);

    let suggestion = "";

    if (hours < 3) {
      suggestion = "⚡ Focus on 1 subject deeply.";
    } else if (hours < 6) {
      suggestion = "🔥 Balanced study day!";
    } else {
      suggestion = "🚀 High performance day! Add revision.";
    }

    let plan = `
    📅 Daily Plan:<br><br>
    🧮 Math: ${math} hrs<br>
    ⚛️ Physics: ${physics} hrs<br>
    🧪 Chemistry: ${chemistry} hrs<br><br>
    
    💡 AI Suggestion:<br>
    ${suggestion}
    `;

    document.getElementById("output").innerHTML = plan;
  }
  </script>

</body>
</html>
