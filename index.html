<!DOCTYPE html>
<html>
<head>
  <title>AI Study Planner</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #22c55e;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>📚 AI Study Planner</h1>

  <p>Enter study hours:</p>
  <input type="number" id="hours" placeholder="e.g. 5">

  <br>
  <button onclick="generatePlan()">Generate Plan</button>

  <h2 id="output"></h2>
  <h3>✅ Track Your Progress</h3>

<label><input type="checkbox"> Math Done</label><br>
<label><input type="checkbox"> Physics Done</label><br>
<label><input type="checkbox"> Chemistry Done</label><br>

  <script>
  function generatePlan() {
    let hours = document.getElementById("hours").value;

    if (hours == "") {
      alert("Enter hours!");
      return;
    }

    let math = (hours * 0.4).toFixed(1);
    let physics = (hours * 0.3).toFixed(1);
    let chemistry = (hours * 0.3).toFixed(1);

    let plan = `
    📅 Daily Plan:<br><br>
    🧮 Math: ${math} hrs<br>
    ⚛️ Physics: ${physics} hrs<br>
    🧪 Chemistry: ${chemistry} hrs<br><br>
    
    ⏰ Suggested Routine:<br>
    Morning: Math<br>
    Afternoon: Physics<br>
    Evening: Chemistry
    `;

    document.getElementById("output").innerHTML = plan;
  }
  </script>

</body>
</html>
